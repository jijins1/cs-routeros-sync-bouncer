name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # The race detector matters here: the stream consumer writes to the
      # decision set while the reconciler reads snapshots from it.
      - name: Test
        run: CGO_ENABLED=1 go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Total coverage
        run: go tool cover -func=coverage.out | tail -1

      # The logic that keeps the router from filling up lives in these three
      # packages, so they are held to a real threshold. The RouterOS wire layer
      # is deliberately excluded: it is exercised against a device, not in CI.
      - name: Coverage gate on core logic
        run: |
          set -uo pipefail
          threshold=80
          failed=0
          for pkg in decision reconciler config crowdsec; do
            pct=$(go test -cover ./internal/$pkg/ \
                  | sed -n 's/.*coverage: \([0-9.]*\)% of statements.*/\1/p')
            printf 'internal/%-12s %s%%\n' "$pkg" "$pct"
            if awk "BEGIN{exit !($pct < $threshold)}"; then
              echo "::error::internal/$pkg coverage ${pct}% is below ${threshold}%"
              failed=1
            fi
          done
          exit $failed

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  image:
    name: Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Needed to build the arm64 image on an amd64 runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # Built on pull requests too, so a broken Dockerfile is caught before
      # merge; only pushed once the change is on a branch or tag.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
